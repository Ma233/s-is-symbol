[package]
name = "s-is-symbol"
version = "0.1.1"
edition = "2024"
description = "Jump to code declarations in Neovim"
homepage = "https://github.com/ma233/s-is-symbol"
license = "MIT"
repository = "https://github.com/ma233/s-is-symbol"
readme = "README.md"

[lib]
name = "symbol"
path = "src/lib.rs"

[[bin]]
name = "s"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.46", features = ["derive", "env"] }
fs2 = "0.4.3"
hex = "0.4.3"
onoma = "0.0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.17"

[dev-dependencies]
filetime = "0.2.26"
tempfile = "3.21.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
