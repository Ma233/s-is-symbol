name: Build then release

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'prerelease' }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y musl-tools

      - name: Add target
        run: rustup target add "${{ matrix.target }}"

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: build-then-release-${{ matrix.target }}-v1

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}" -p s-is-symbol

      - name: Verify binary
        run: ./target/${{ matrix.target }}/release/s --version

      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        run: |
          file "./target/${{ matrix.target }}/release/s" | tee file.out
          grep -Eq "statically linked|static-pie linked" file.out

      - name: Package artifact
        run: |
          zip -j "s-${{ env.VERSION }}-${{ matrix.target }}.zip" \
            "./target/${{ matrix.target }}/release/s"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ env.VERSION }}-${{ matrix.target }}
          path: "*.zip"
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Move prerelease tag
        if: env.VERSION == 'prerelease'
        run: |
          git tag --force prerelease "${{ github.sha }}"
          git push --force origin refs/tags/prerelease

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4.8.0
        id: git-cliff
        with:
          config: cliff.toml
          args: "-vv --strip header ${{ env.VERSION == 'prerelease' && '--unreleased' || '--latest' }}"

      - uses: actions/download-artifact@v8.0.1
        with:
          path: release
          merge-multiple: true

      - name: Stage installer
        run: cp install.sh release/install.sh

      - name: Emit GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          body: "${{ steps.git-cliff.outputs.content }}"
          tag: ${{ env.VERSION }}
          prerelease: ${{ env.VERSION == 'prerelease' }}
          file_glob: true
          overwrite: true
          file: release/*
